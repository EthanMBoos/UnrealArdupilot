name: nightly-jsbsim
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUVD_BUILD_TESTS=OFF
      - run: cmake --build build --parallel 2
      - run: python3 -m pip install jsbsim==1.3.1
      - run: python3 tools/jsbsim_compare.py --samples 10000
